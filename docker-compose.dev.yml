version: '3.8'

services:
  # =============================================================================
  # Infrastructure Layer
  # =============================================================================

  db:
    image: postgres:15
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crm_user -d crm_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: crm-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - crm-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: crm-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - crm-network

  # =============================================================================
  # Service Layer - API Gateway
  # =============================================================================

  gateway:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: crm-gateway
    restart: unless-stopped
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://crm_user:password@db:5432/crm_db
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - crm-network

  # =============================================================================
  # Service Layer - Individual Microservices
  # =============================================================================

  auth:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: crm-auth
    restart: unless-stopped
    command: uvicorn services.auth.main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://crm_user:password@db:5432/crm_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/oauth/gmail/callback}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-base64}
    ports:
      - "8001:8001"
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm-network

  email_sync:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: crm-email-sync
    restart: unless-stopped
    command: uvicorn services.email_sync.main:app --host 0.0.0.0 --port 8002 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://crm_user:password@db:5432/crm_db
      - REDIS_URL=redis://redis:6379/0
      - GMAIL_SCOPES=${GMAIL_SCOPES}
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_PATH=/app/storage
    ports:
      - "8002:8002"
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
      - email_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm-network

  crm:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: crm-service
    restart: unless-stopped
    command: uvicorn services.crm.main:app --host 0.0.0.0 --port 8003 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://crm_user:password@db:5432/crm_db
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
      - "8003:8003"
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - crm-network

  ai:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: crm-ai
    restart: unless-stopped
    command: uvicorn services.ai.main:app --host 0.0.0.0 --port 8004 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://crm_user:password@db:5432/crm_db
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8004:8004"
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm-network

  automation:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: crm-automation
    restart: unless-stopped
    command: uvicorn services.automation.main:app --host 0.0.0.0 --port 8005 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://crm_user:password@db:5432/crm_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8005:8005"
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm-network

  analytics:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: crm-analytics
    restart: unless-stopped
    command: uvicorn services.analytics.main:app --host 0.0.0.0 --port 8006 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://crm_user:password@db:5432/crm_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8006:8006"
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm-network

  integration:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: crm-integration
    restart: unless-stopped
    command: uvicorn services.integration.main:app --host 0.0.0.0 --port 8007 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://crm_user:password@db:5432/crm_db
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    ports:
      - "8007:8007"
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm-network

  notification:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: crm-notification
    restart: unless-stopped
    command: uvicorn services.notification.main:app --host 0.0.0.0 --port 8008 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://crm_user:password@db:5432/crm_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8008:8008"
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm-network

  # =============================================================================
  # Frontend Layer
  # =============================================================================

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: development
    container_name: crm-frontend
    restart: unless-stopped
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NODE_ENV=development
      - INTERNAL_API_URL=http://gateway:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - gateway
    networks:
      - crm-network

  # =============================================================================
  # Database Migration Service (run once)
  # =============================================================================

  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: crm-migrate
    command: alembic upgrade head
    environment:
      - DATABASE_URL=postgresql+asyncpg://crm_user:password@db:5432/crm_db
    volumes:
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
      - ./shared:/app/shared
      - ./services:/app/services
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm-network
    profiles:
      - tools

# =============================================================================
# Networks
# =============================================================================

networks:
  crm-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  email_storage:
    driver: local
